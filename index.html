				let course = COURSES[round.courseId];
				if (!course) course = await loadCourse(round.courseId);
				if (!course) {
					toast("Could not load that round's course", "err");
					return;
				}
				const holes = course.holes;
				let html =
					'<h3 class="modal-title">' + escapeHtml(round.courseName) + "</h3>" +
					'<p style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">' +
					fmtDate(round.date) + " &middot; " + escapeHtml(roundTeeLabel(round)) + "</p>" +
					'<div class="sc-tablewrap"><table class="sc"><thead><tr><th>Hole</th>' +
					round.players.map(p => "<th>" + escapeHtml(p.name) + "</th>").join("") +
					"</tr></thead><tbody>" +
					holes.map((h, hi) =>
						"<tr><td>" + h.number + " &middot; P" + h.par + "</td>" +
						round.players.map(p => "<td>" + (p.scores[hi] != null ? p.scores[hi] : "&ndash;") + "</td>").join("") +
						"</tr>"
					).join("") +
					'<tr class="subtotal"><td>Total</td>' +
					round.players.map(p => "<td>" + p.scores.reduce((a,b) => a + (b || 0), 0) + "</td>").join("") +
					"</tr></tbody></table></div>" +
					'<div class="modal-actions"><button class="btn btn-primary btn-block" data-action="open-past-round-editor" data-id="' + id + '">Edit Round</button></div>';
				showModal(html);
			}

		</script>

		<script>
			/* =========================================================================
   BOOT — event delegation + init
   ========================================================================= */
			document.addEventListener("click", async function (e) {
				const el = e.target.closest("[data-action]");
				if (!el || el.disabled) return;
				const action = el.dataset.action;
				switch (action) {
					case "open-auth":
						openAuthModal();
						break;
					case "sign-in":
						authSubmit("signin");
						break;
					case "sign-up":
						authSubmit("signup");
						break;
					case "sign-out":
						signOut();
						break;
					case "close-modal":
						closeModal();
						break;
					case "open-settings":
						openSettingsModal();
						break;
					case "save-settings":
						saveSettingsFromModal();
						break;
					case "export-data":
						exportData();
						break;
					case "nav":
						setView(el.dataset.view);
						break;
					case "start-round-flow":
						openStartRoundModal();
						break;
					case "confirm-start-round":
						confirmStartRound();
						break;
					case "nav-map-builder":
						MAP_SUBMODE = "builder";
						setView("map");
						break;
					case "continue-round":
						continueRound();
						break;
					case "resume-course-builder":
						resumeCourseBuilder(el.dataset.courseId);
						break;
					case "save-exit-builder":
						saveExitBuilder();
						break;
					case "view-round-detail":
						viewRoundDetail(el.dataset.id);
						break;
					case "open-past-round-editor":
						openPastRoundEditor(el.dataset.id);
						break;
					case "save-past-round-meta":
						savePastRoundMeta(el.dataset.id);
						break;
					case "confirm-delete-past-round":
						confirmDeletePastRound(el.dataset.id);
						break;
					case "delete-past-round":
						deletePastRound(el.dataset.id);
						break;
					case "add-club":
						openAddClubModal();
						break;
					case "edit-club":
						openEditClubModal(el.dataset.id);
						break;
					case "save-new-club":
						saveNewClub();
						break;
					case "save-edit-club":
						saveEditClub(el.dataset.id);
						break;
					case "delete-club":
						deleteClub(el.dataset.id);
						break;
					case "new-course":
						openNewCourseModal();
						break;
					case "save-new-course":
						saveNewCourse();
						break;
					case "course-menu":
						openCourseMenu();
						break;
					case "rename-course":
						openRenameCourseModal();
						break;
					case "save-rename-course":
						saveRenameCourse();
						break;
					case "confirm-delete-course":
						confirmDeleteCourse();
						break;
					case "do-delete-course":
						doDeleteCourse();
						break;
					case "add-tee":
						openAddTeeModal();
						break;
					case "save-new-tee":
						saveNewTee();
						break;
					case "set-active-tee":
						setActiveTee(el.dataset.tee);
						break;
					case "change-hole":
						changeHole(+el.dataset.delta);
						break;
					case "set-par":
						setHolePar(+el.dataset.delta);
						break;
					case "open-trace-picker":
						openTracePicker();
						break;
					case "start-trace":
						startTrace(el.dataset.type);
						break;
					case "start-place-tee":
						startPlaceTee();
						break;
					case "start-place-pin":
						startPlacePin();
						break;
					case "cancel-builder-mode":
						cancelBuilderMode();
						break;
					case "undo-trace-point":
						undoTracePoint();
						break;
					case "confirm-place-tee":
						confirmPlaceTee(+el.dataset.lat, +el.dataset.lng);
						break;
					case "focus-feature":
						focusFeature(el.dataset.type, +el.dataset.idx);
						break;
					case "focus-tee":
						focusTee(el.dataset.tee);
						break;
					case "confirm-delete-feature":
						confirmDeleteFeature(el.dataset.type, +el.dataset.idx);
						break;
					case "delete-feature":
						deleteFeature(el.dataset.type, +el.dataset.idx);
						break;
					case "confirm-clear-pin":
						confirmClearPin();
						break;
					case "clear-pin":
						clearPin();
						break;
					case "confirm-clear-tee":
						confirmClearTee(el.dataset.tee);
						break;
					case "clear-tee":
						clearTee(el.dataset.tee);
						break;
					case "map-submode":
						setMapSubmode(el.dataset.mode);
						break;
					case "live-change-hole":
						liveChangeHole(+el.dataset.delta);
						break;
					case "live-fit":
						liveFit();
						break;
					case "start-caddie":
						startCaddie();
						break;
					case "hit-shot":
						openHitShotModal();
						break;
					case "confirm-hit-shot":
						confirmHitShot();
						break;
					case "finish-shot":
						finishShot();
						break;
					case "save-full-swing":
						savePendingFullSwing(true);
						break;
					case "skip-full-swing":
						savePendingFullSwing(false);
						break;
					case "refresh-caddie":
						refreshCaddieWeather();
						break;
					case "edit-hole":
						openEditHoleModal(+el.dataset.player, +el.dataset.hole, el.dataset.roundId);
						break;
					case "save-edit-hole":
						saveEditHole(+el.dataset.player, +el.dataset.hole, el.dataset.roundId);
						break;
					case "finish-round":
						confirmFinishRound();
						break;
					case "do-finish-round":
						doFinishRound();
						break;
				}
			});
			document
				.querySelectorAll("#bottomnav button")
				.forEach(function (b) {
					b.addEventListener("click", function () {
						setView(b.dataset.nav);
					});
				});

			async function init() {
				await initCloudAuth();
				const [clubs, coursesIndex, roundsIndex, settings, active] =
					await Promise.all([
						sget("clubs"),
						sget("courses-index"),
						sget("rounds-index"),
						sget("settings"),
						sget("active"),
					]);
				if (clubs && clubs.length) { CLUBS = clubs; CLUBS.forEach(normalizeClub); }
				else {
					CLUBS = DEFAULT_CLUBS.map(function (d) {
						return {
							id: uid(),
							name: d[0],
							type: d[1],
							requiresTee: d[2],
							avgCarry: d[3],
							shotsRecorded: 0,
							distances: [],
							fullSwingDistances: [],
							fullSwingAvg: d[3],
							stockCarry: d[3],
							partialShots: 0,
							dispersion: { lr: 0, ls: 0 },
						};
					});
					CLUBS.forEach(normalizeClub);
					await sset("clubs", CLUBS);
				}
				if (coursesIndex) COURSES_INDEX = coursesIndex;
				if (roundsIndex) ROUNDS_INDEX = roundsIndex;
				if (settings) SETTINGS = settings;
				if (active) ACTIVE = active;
				if (!ACTIVE.builderProgress || typeof ACTIVE.builderProgress !== "object") ACTIVE.builderProgress = {};
				if (ACTIVE.builderCourseId && !ACTIVE.builderProgress[ACTIVE.builderCourseId]) {
					ACTIVE.builderProgress[ACTIVE.builderCourseId] = {
						holeIndex: Number.isFinite(ACTIVE.builderHoleIndex) ? ACTIVE.builderHoleIndex : 0,
						teeName: ACTIVE.builderTeeName || null,
					};
				}
				if (ACTIVE.builderCourseId) {
					BUILDER.courseId = ACTIVE.builderCourseId;
					const bp = ACTIVE.builderProgress[ACTIVE.builderCourseId] || {};
					BUILDER.holeIndex = Number.isFinite(bp.holeIndex) ? bp.holeIndex : 0;
					ACTIVE.builderTeeName = bp.teeName || ACTIVE.builderTeeName || null;
				}

				if (ACTIVE.activeRoundId) {
					const r = await sget("round:" + ACTIVE.activeRoundId);
					if (r && !r.completed) {
						ROUNDS[ACTIVE.activeRoundId] = r;
						stopGpsWatch();
						LIVE.myPos = null; LIVE.gpsActive = false;
					} else {
						ACTIVE.activeRoundId = null;
						await sset("active", ACTIVE);
					}
				}
				setView("home");
			}
			if (document.readyState === "loading") {
				document.addEventListener("DOMContentLoaded", init);
			} else {
				init();
			}
		</script>

		</script>
	</body>
</html>
