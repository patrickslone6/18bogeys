			function renderBuilderToolbar() {
				const tb = document.getElementById("builder-toolbar");
				if (!tb) return;
				if (!BUILDER.mode) {
					tb.innerHTML =
						'<button class="map-fab primary" data-action="open-trace-picker">Trace</button>' +
						'<button class="map-fab" data-action="start-place-tee">Place Tee</button>' +
						'<button class="map-fab" data-action="start-place-pin">Place Pin</button>';
					updateBuilderBanner(null);
				} else if (BUILDER.mode === "trace") {
					tb.innerHTML =
						'<button class="map-fab" data-action="undo-trace-point">Undo Point</button>' +
						'<button class="map-fab" data-action="cancel-builder-mode">Cancel</button>';
					updateBuilderBanner(
						"Tracing " +
							FEATURE_LABEL[BUILDER.traceType] +
							" — tap points around it, then tap the first point again to finish. (" +
							BUILDER.tracePoints.length +
							" pts)",
					);
				} else if (BUILDER.mode === "tee") {
					tb.innerHTML =
						'<button class="map-fab" data-action="cancel-builder-mode">Cancel</button>';
					updateBuilderBanner(
						"Tap the map where the " +
							escapeHtml(ACTIVE.builderTeeName || "") +
							" tee box is.",
					);
				} else if (BUILDER.mode === "pin") {
					tb.innerHTML =
						'<button class="map-fab" data-action="cancel-builder-mode">Cancel</button>';
					updateBuilderBanner("Tap the map to place the pin.");
				}
			}
			function updateBuilderBanner(text) {
				const b = document.getElementById("builder-banner");
				if (!b) return;
				if (text) {
					b.textContent = text;
					b.classList.remove("hidden");
				} else {
					b.classList.add("hidden");
					b.textContent = "";
				}
			}
			function openTracePicker() {
				showModal(
					'<h3 class="modal-title">What are you tracing?</h3><div style="display:flex;flex-direction:column;gap:8px;">' +
						Object.keys(FEATURE_LABEL)
							.map(
								(k) =>
									'<button class="btn btn-block" data-action="start-trace" data-type="' +
									k +
									'" style="justify-content:flex-start;">' +
									'<span class="swatch" style="background:' +
									FEATURE_COLOR[k] +
									';margin-right:9px;"></span>' +
									FEATURE_LABEL[k] +
									"</button>",
							)
							.join("") +
						"</div>",
				);
			}
			function startTrace(type) {
				closeModal();
				BUILDER.mode = "trace";
				BUILDER.traceType = type;
				BUILDER.tracePoints = [];
				clearTempLayer();
				renderBuilderToolbar();
			}
			function startPlaceTee() {
				if (!ACTIVE.builderTeeName) {
					toast("Add a tee set first", "err");
					return;
				}
				BUILDER.mode = "tee";
				renderBuilderToolbar();
			}
			function startPlacePin() {
				BUILDER.mode = "pin";
				renderBuilderToolbar();
			}
			function cancelBuilderMode() {
				BUILDER.mode = null;
				BUILDER.traceType = null;
				BUILDER.tracePoints = [];
				clearTempLayer();
				renderBuilderToolbar();
			}
			function undoTracePoint() {
				BUILDER.tracePoints.pop();
				redrawTempTrace();
				renderBuilderToolbar();
			}
			function clearTempLayer() {
				if (BUILDER.layers.temp) BUILDER.layers.temp.clearLayers();
			}
			function redrawTempTrace() {
				BUILDER.layers.temp.clearLayers();
				const pts = BUILDER.tracePoints;
				pts.forEach((p) => {
					L.circleMarker([p.lat, p.lng], {
						radius: 5,
						color: "#14161A",
						weight: 2,
						fillColor: "#fff",
						fillOpacity: 1,
					}).addTo(BUILDER.layers.temp);
				});
				if (pts.length > 1) {
					L.polyline(
						pts.map((p) => [p.lat, p.lng]),
						{
							color:
								FEATURE_COLOR[BUILDER.traceType] || "#14161A",
							weight: 3,
							dashArray: "6,6",
						},
					).addTo(BUILDER.layers.temp);
				}
			}
			function onBuilderMapClick(e) {
				const latlng = { lat: e.latlng.lat, lng: e.latlng.lng };
				if (BUILDER.mode === "trace") handleTraceClick(latlng);
				else if (BUILDER.mode === "tee") handleTeeClick(latlng);
				else if (BUILDER.mode === "pin") handlePinClick(latlng);
			}
			function handleTraceClick(latlng) {
				if (BUILDER.tracePoints.length >= 3) {
					const first = BUILDER.tracePoints[0];
					const p1 = BUILDER.map.latLngToContainerPoint([
						first.lat,
						first.lng,
					]);
					const p2 = BUILDER.map.latLngToContainerPoint([
						latlng.lat,
						latlng.lng,
					]);
					if (Math.hypot(p1.x - p2.x, p1.y - p2.y) < 20) {
						finishTrace();
						return;
					}
				}
				BUILDER.tracePoints.push(latlng);
				redrawTempTrace();
				renderBuilderToolbar();
			}
			async function finishTrace() {
				const course = COURSES[BUILDER.courseId];
				const hole = course.holes[BUILDER.holeIndex];
				const type = BUILDER.traceType;
				hole[type].push(BUILDER.tracePoints.slice());
				if (!(await sharedCourseSave(course))) return;
				BUILDER.mode = null;
				BUILDER.traceType = null;
				BUILDER.tracePoints = [];
				clearTempLayer();
				drawBuilderFeatures(course, hole, ACTIVE.builderTeeName);
				renderShapesList(course, hole);
				renderBuilderToolbar();
				toast(FEATURE_LABEL[type] + " saved", "ok");
			}
			function handleTeeClick(latlng) {
				showModal(
					'<h3 class="modal-title">' +
						escapeHtml(ACTIVE.builderTeeName) +
						" Tee Box</h3>" +
						'<div class="field"><label>Radius (yards)</label><input type="number" id="tee-radius" value="25"></div>' +
						'<div class="modal-actions"><button class="btn btn-primary btn-block" data-action="confirm-place-tee" data-lat="' +
						latlng.lat +
						'" data-lng="' +
						latlng.lng +
						'">Save Tee Box</button></div>',
				);
			}
			async function confirmPlaceTee(lat, lng) {
				const radius =
					parseFloat(document.getElementById("tee-radius").value) ||
					25;
				const course = COURSES[BUILDER.courseId];
				const hole = course.holes[BUILDER.holeIndex];
				const teeName = ACTIVE.builderTeeName;
				if (!hole.tees[teeName]) hole.tees[teeName] = { yardage: 0 };
				hole.tees[teeName].lat = lat;
				hole.tees[teeName].lng = lng;
				hole.tees[teeName].radius = radius;
				if (!hole.tees[teeName].yardage && hole.pin) {
					hole.tees[teeName].yardage = Math.round(
						distYards({ lat, lng }, hole.pin),
					);
				}
				if (!(await sharedCourseSave(course))) return;
				closeModal();
				BUILDER.mode = null;
				drawBuilderFeatures(course, hole, teeName);
				renderShapesList(course, hole);
				renderBuilderToolbar();
				const inp = document.querySelector(
					'[data-yardage-tee="' + CSS.escape(teeName) + '"]',
				);
				if (inp) inp.value = hole.tees[teeName].yardage || "";
				toast("Tee box saved", "ok");
			}
			function handlePinClick(latlng) {
				savePinLocation(latlng);
			}
			async function savePinLocation(latlng) {
				const course = COURSES[BUILDER.courseId];
				const hole = course.holes[BUILDER.holeIndex];
				hole.pin = latlng;
				if (!(await sharedCourseSave(course))) return;
				BUILDER.mode = null;
				drawBuilderFeatures(course, hole, ACTIVE.builderTeeName);
				renderShapesList(course, hole);
				renderBuilderToolbar();
				toast("Pin placed", "ok");
			}
			function renderShapesList(course, hole) {
				const el = document.getElementById("shapes-list");
				if (!el) return;
				let html = "";
				["fairway", "green", "bunkers", "water", "ob"].forEach(
					(type) => {
						(hole[type] || []).forEach((poly, idx) => {
							const label =
								FEATURE_LABEL[type] +
								(hole[type].length > 1 ? " " + (idx + 1) : "");
							html +=
								'<div class="shaperow" data-action="focus-feature" data-type="' +
								type +
								'" data-idx="' +
								idx +
								'" style="cursor:pointer;">' +
								'<span class="swatch" style="background:' +
								FEATURE_COLOR[type] +
								';"></span>' +
								'<span class="sname">' +
								label +
								'</span><span class="scount">' +
								poly.length +
								' pts</span><button type="button" class="iconbtn" data-action="confirm-delete-feature" data-type="' +
								type +
								'" data-idx="' +
								idx +
								'" title="Delete ' +
								label +
								'" style="color:var(--red);">&times;</button></div>';
						});
					},
				);
				if (hole.pin) {
					html +=
						'<div class="shaperow" data-action="focus-pin" style="cursor:pointer;"><span class="swatch" style="background:#14161A;"></span><span class="sname">Pin</span><span class="scount">Placed</span><button type="button" class="iconbtn" data-action="confirm-clear-pin" title="Delete pin" style="color:var(--red);">&times;</button></div>';
				}
				course.teeNames.forEach((t) => {
					const te = hole.tees[t];
					if (te && te.lat != null) {
						html +=
							'<div class="shaperow" data-action="focus-tee" data-tee="' +
							escapeHtml(t) +
							'" style="cursor:pointer;">' +
							'<span class="swatch" style="background:#C8102E;"></span>' +
							'<span class="sname">' +
							escapeHtml(t) +
							' Tee Box</span><span class="scount">' +
							Math.round(te.radius || 25) +
							'yd radius</span><button type="button" class="iconbtn" data-action="confirm-clear-tee" data-tee="' +
							escapeHtml(t) +
							'" title="Clear tee box" style="color:var(--red);">&times;</button></div>';
					}
				});
				el.innerHTML =
					html ||
					'<div class="empty">Nothing mapped on this hole yet. Use Trace, Place Tee and Place Pin above.</div>';
			}
			function focusFeature(type, idx) {
				const course = COURSES[BUILDER.courseId];
				const hole = course.holes[BUILDER.holeIndex];
				const poly = hole[type][idx];
				BUILDER.map.fitBounds(
					L.latLngBounds(poly.map((p) => [p.lat, p.lng])),
					{ padding: [40, 40] },
				);
			}
			function focusTee(teeName) {
				const course = COURSES[BUILDER.courseId];
				const hole = course.holes[BUILDER.holeIndex];
				const t = hole.tees[teeName];
				if (t && t.lat != null) BUILDER.map.setView([t.lat, t.lng], 19);
			}
			function focusPin() {
				const hole = COURSES[BUILDER.courseId].holes[BUILDER.holeIndex];
				if (hole.pin)
					BUILDER.map.setView([hole.pin.lat, hole.pin.lng], 19);
			}
			function confirmDeleteFeature(type, idx) {
				const label = FEATURE_LABEL[type] || "feature";
				showModal(
					'<h3 class="modal-title">Delete ' +
						label +
						'?</h3><p style="font-size:13.5px;color:var(--ink-soft);">This removes it from the current hole.</p><div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn" style="color:var(--red);" data-action="delete-feature" data-type="' +
						type +
						'" data-idx="' +
						idx +
						'">Delete</button></div>',
				);
			}
			async function deleteFeature(type, idx) {
				const course = COURSES[BUILDER.courseId],
					hole = course.holes[BUILDER.holeIndex];
				hole[type].splice(idx, 1);
				if (!(await sharedCourseSave(course))) return;
				closeModal();
				drawBuilderFeatures(course, hole, ACTIVE.builderTeeName);
				renderShapesList(course, hole);
				toast("Mapped feature deleted");
			}
			function confirmClearPin() {
				showModal(
					'<h3 class="modal-title">Delete pin?</h3><p style="font-size:13.5px;color:var(--ink-soft);">This removes the pin from the current hole.</p><div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn" style="color:var(--red);" data-action="clear-pin">Delete</button></div>',
				);
			}
			async function clearPin() {
				const course = COURSES[BUILDER.courseId],
					hole = course.holes[BUILDER.holeIndex];
				hole.pin = null;
				if (!(await sharedCourseSave(course))) return;
				closeModal();
				drawBuilderFeatures(course, hole, ACTIVE.builderTeeName);
				renderShapesList(course, hole);
				toast("Pin deleted");
			}
			function confirmClearTee(teeName) {
				showModal(
					'<h3 class="modal-title">Clear ' +
						escapeHtml(teeName) +
						' tee box?</h3><p style="font-size:13.5px;color:var(--ink-soft);">The tee set and its yardage stay; only this hole’s mapped tee-box location is removed.</p><div class="modal-actions"><button class="btn" data-action="close-modal">Cancel</button><button class="btn" style="color:var(--red);" data-action="clear-tee" data-tee="' +
						escapeHtml(teeName) +
						'">Clear location</button></div>',
				);
			}
			async function clearTee(teeName) {
				const course = COURSES[BUILDER.courseId],
					hole = course.holes[BUILDER.holeIndex],
					tee = hole.tees[teeName];
				if (tee) {
					tee.lat = null;
					tee.lng = null;
					tee.radius = 25;
					await sset("course:" + course.id, course);
				}
				closeModal();
				drawBuilderFeatures(course, hole, ACTIVE.builderTeeName);
				renderShapesList(course, hole);
				toast("Tee-box location cleared");
			}
		</script>

		<script>
			/* =========================================================================
   START ROUND FLOW
   ========================================================================= */
			async function openStartRoundModal() {
				if (!COURSES_INDEX.length) {
					toast("Create a course first in Course Builder", "err");
					return;
				}
				const firstId = COURSES_INDEX[0].id;
				if (!COURSES[firstId]) await loadCourse(firstId);
				showModal(
					'<h3 class="modal-title">Start a Round</h3>' +
						'<div class="field"><label>Course</label><select id="sr-course">' +
						COURSES_INDEX.map(
							(c) =>
								'<option value="' +
								c.id +
								'">' +
								escapeHtml(c.name) +
								"</option>",
						).join("") +
						"</select></div>" +
						'<div class="field"><label>Players and tees</label><div id="sr-players" style="display:flex;flex-direction:column;gap:8px;"></div>' +
						'<button type="button" class="chip" data-action="sr-add-player" style="margin-top:8px;">+ Add Player</button></div>' +
						'<div class="modal-actions"><button class="btn btn-primary btn-block" data-action="confirm-start-round">Start Round</button></div>',
					(root) => {
						window.__srPlayers = [
							{
								name: SETTINGS.playerName || "You",
								teeName: null,
							},
						];
						renderSrPlayers(root);
						root.querySelector("#sr-course").addEventListener(
							"change",
							async (e) => {
								const id = e.target.value;
								if (!COURSES[id])
									await loadCourse(id);
								renderSrPlayers(root);
							},
						);
						root.querySelector(
							'[data-action="sr-add-player"]',
						).addEventListener("click", () => {
							window.__srPlayers.push({
								name:
									"Player " + (window.__srPlayers.length + 1),
								teeName: null,
							});
							renderSrPlayers(root);
						});
					},
				);
			}
			function renderSrPlayers(root) {
				const wrap = root.querySelector("#sr-players");
				const course = COURSES[root.querySelector("#sr-course").value];
				if (!course || !course.teeNames.length) {
					wrap.innerHTML =
						'<span style="font-size:12.5px;color:var(--ink-faint);">This course has no tee sets yet — add one in Course Builder first.</span>';
					return;
				}
				window.__srPlayers.forEach((p) => {
					if (!course.teeNames.includes(p.teeName))
						p.teeName = course.teeNames[0];
				});
				wrap.innerHTML = window.__srPlayers
					.map(
						(player, i) =>
							'<div style="display:flex;gap:8px;align-items:center;">' +
							'<input type="text" data-sr-player-name="' +
							i +
							'" value="' +
							escapeHtml(player.name) +
							'" aria-label="Player name" style="flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;font-size:14px;">' +
							'<select data-sr-player-tee="' +
							i +
							'" aria-label="' +
							escapeHtml(player.name) +
							' tee" style="width:92px;border:1px solid var(--line-strong);border-radius:8px;padding:9px 6px;font-size:13px;background:#fff;">' +
							course.teeNames
								.map(
									(t) =>
										'<option value="' +
										escapeHtml(t) +
										'"' +
										(t === player.teeName
											? " selected"
											: "") +
										">" +
										escapeHtml(t) +
										"</option>",
								)
								.join("") +
							"</select>" +
							(window.__srPlayers.length > 1
								? '<button type="button" class="iconbtn" data-sr-removeplayer="' +
									i +
									'">&times;</button>'
								: "") +
							"</div>",
					)
					.join("");
				wrap.querySelectorAll("[data-sr-player-name]").forEach((inp) =>
					inp.addEventListener("input", (e) => {
						window.__srPlayers[
							+e.target.dataset.srPlayerName
						].name = e.target.value;
					}),
				);
				wrap.querySelectorAll("[data-sr-player-tee]").forEach((sel) =>
					sel.addEventListener("change", (e) => {
						window.__srPlayers[
							+e.target.dataset.srPlayerTee
						].teeName = e.target.value;
					}),
				);
				wrap.querySelectorAll("[data-sr-removeplayer]").forEach((b) =>
					b.addEventListener("click", (e) => {
						window.__srPlayers.splice(
							+e.target.dataset.srRemoveplayer,
							1,
						);
						renderSrPlayers(root);
					}),
				);
			}
			async function confirmStartRound() {
				const root = document.getElementById("modal-root");
				const courseId = root.querySelector("#sr-course").value;
				const course = COURSES[courseId];
				if (!course) {
					toast("Course not loaded", "err");
					return;
				}
				const selections = (window.__srPlayers || [])
					.map((p) => ({ name: p.name.trim(), teeName: p.teeName }))
					.filter((p) => p.name);
				if (!selections.length) {
					toast("Add at least one player", "err");
					return;
				}
				if (
					selections.some((p) => !course.teeNames.includes(p.teeName))
				) {
					toast("Choose a tee for every player", "err");
					return;
				}
				const players = selections.map((selection) => ({
					name: selection.name,
					teeName: selection.teeName,
					scores: new Array(course.numHoles).fill(null),
					putts: new Array(course.numHoles).fill(null),
					gir: new Array(course.numHoles).fill(null),
					fairway: new Array(course.numHoles).fill(null),
				}));
				const id = uid();
				const teeName = selections[0].teeName;
				const round = {
					id,
					courseId,
					courseName: course.name,
					teeName,
					date: todayISO(),
					numHoles: course.numHoles,
					currentHole: 1,
					players,
					completed: false,
					shots: [],
				};
				ROUNDS[id] = round;
				ROUNDS_INDEX.push({
					id,
					courseId,
					courseName: course.name,
					date: round.date,
					teeName: roundTeeLabel(round),
					scoreRel: 0,
					completed: false,
				});
				await sset("round:" + id, round);
				await sset("rounds-index", ROUNDS_INDEX);
				ACTIVE.activeRoundId = id;
				await sset("active", ACTIVE);
				LIVE.lastRec = null;
				clearDispersionMap();
				LIVE.weather = null;
				LIVE.elevPinFor = null;
				MAP_SUBMODE = "live";
				closeModal();
				toast("Round started — good luck out there", "ok");
				stopGpsWatch();
				LIVE.myPos = null; LIVE.gpsActive = false;
				setView("map");
			}
			function continueRound() {
				MAP_SUBMODE = "live";
				setView("map");
			}

			/* =========================================================================
   LIVE ROUND MAP
   ========================================================================= */
			async function renderLive() {
				const body = document.getElementById("map-body");
				const round = ROUNDS[ACTIVE.activeRoundId];
				if (!round) {
					body.innerHTML =
						'<div class="empty">No active round.</div>';
					return;
				}
				if (!COURSES[round.courseId])
					COURSES[round.courseId] = await sget(
						"course:" + round.courseId,
					);
				const course = COURSES[round.courseId];
				if (!course) {
					body.innerHTML =
						'<div class="empty">Could not load this course.</div>';
					return;
				}
				const hole = course.holes[round.currentHole - 1];
				const teeInfo = hole.tees[round.teeName] || {};
				const holeMapped =
					hole.fairway.length || hole.green.length || hole.pin;

				let html =
					'<div class="holepager">' +
					'<button class="iconbtn" data-action="live-change-hole" data-delta="-1"' +
					(round.currentHole <= 1 ? " disabled" : "") +
					">‹</button>" +
					'<div class="holebadge"><b>' +
					hole.number +
					"</b><span>Par " +
					hole.par +
					" · " +
					(teeInfo.yardage || "—") +
					" yd · " +
					escapeHtml(round.teeName) +
					"</span></div>" +
					'<button class="iconbtn" data-action="live-change-hole" data-delta="1"' +
					(round.currentHole >= round.numHoles ? " disabled" : "") +
					">›</button>" +
					"</div>";

				if (!holeMapped)
					html +=
						'<div class="map-banner" style="position:static;">This hole hasn\'t been mapped yet — add it in Course Builder for full Caddie support.</div>';
				if (LIVE.gpsError)
					html +=
						'<div class="map-banner" style="position:static;background:#FDEBEC;border-color:#E9A7AC;color:var(--red-dark);">' +
						escapeHtml(LIVE.gpsError) +
						"</div>";
				else if (LIVE.gpsWarning)
					html +=
						'<div class="map-banner" style="position:static;">' +
						escapeHtml(LIVE.gpsWarning) +
						"</div>";

				html +=
					'<div class="map-wrap"><div class="map-canvas live" id="live-map"></div>' +
					'<div class="map-overlay-top"><div class="pill" id="live-dist-pill">' +
					svgFlagSmall() +
					" Locating…</div></div>" +
					'<div class="map-overlay-bottom">' +
					'<button class="map-fab" data-action="live-fit">Fit</button>' +
					'<button class="map-fab primary" data-action="' + (LIVE.pendingShotClub ? 'finish-shot' : (LIVE.gpsActive ? 'hit-shot' : 'start-caddie')) + '">' + (LIVE.pendingShotClub ? 'Finish Shot' : (LIVE.gpsActive ? 'Hit Shot' : 'Start Caddie')) + '</button>' +
					"</div></div>";

				html +=
					'<div class="btn-row"><button class="btn btn-block" data-action="nav" data-view="caddie">Open Smart Caddie</button></div>';

				body.innerHTML = html;
				initLiveMap(course, hole, teeInfo);
				updateLiveDistPill();
				reflectShotState();
			}
			function initLiveMap(course, hole, teeInfo) {
				const container = document.getElementById("live-map");
				if (!container) return;
				if (LIVE.map) {
					LIVE.map.remove();
					LIVE.map = null;
				}
				LIVE.layers = {};
				let center =
					hole.pin ||
					(teeInfo && teeInfo.lat != null
						? teeInfo
						: course.location);
				LIVE.map = L.map(container, { zoomControl: false }).setView(
					[center.lat, center.lng],
					17,
				);
				L.tileLayer(
					"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
					{ maxZoom: 20, attribution: "&copy; OpenStreetMap" },
				).addTo(LIVE.map);
				LIVE.layers.features = L.layerGroup().addTo(LIVE.map);
				drawLiveFeatures(course, hole, teeInfo);
				if (LIVE.myPos) updateLiveGpsMarker();
				if (LIVE.lastRec) updateLiveMapRecommendation();
				setTimeout(() => {
					if (LIVE.map) LIVE.map.invalidateSize();
				}, 60);
			}
			function drawLiveFeatures(course, hole, teeInfo) {
				LIVE.layers.features.clearLayers();
				["fairway", "green", "bunkers", "water", "ob"].forEach(
					(type) => {
						(hole[type] || []).forEach((poly) => {
							L.polygon(
								poly.map((p) => [p.lat, p.lng]),
								{
									color: FEATURE_COLOR[type],
									weight: 2,
									fillColor: FEATURE_COLOR[type],
									fillOpacity: FEATURE_FILL[type],
								},
							).addTo(LIVE.layers.features);
						});
					},
				);
				if (hole.pin)
					L.marker([hole.pin.lat, hole.pin.lng], {
						icon: pinIcon(),
					}).addTo(LIVE.layers.features);
				if (teeInfo && teeInfo.lat != null) {
					L.circle([teeInfo.lat, teeInfo.lng], {
						radius: yardsToMeters(teeInfo.radius || 25),
						color: "#C8102E",
						weight: 2,
						fillColor: "#C8102E",
						fillOpacity: 0.12,
					}).addTo(LIVE.layers.features);
				}
			}
			function liveFit() {
				if (!LIVE.map) return;
				const round = ROUNDS[ACTIVE.activeRoundId];
				const course = COURSES[round.courseId];
				const hole = course.holes[round.currentHole - 1];
				const pts = [];
				if (LIVE.myPos) pts.push([LIVE.myPos.lat, LIVE.myPos.lng]);
				if (LIVE.layers.landing)
					pts.push(LIVE.layers.landing.getLatLng());
				if (hole.pin) pts.push([hole.pin.lat, hole.pin.lng]);
				if (pts.length < 2) {
					if (pts.length === 1) LIVE.map.setView(pts[0], 18);
					return;
				}
				LIVE.map.fitBounds(L.latLngBounds(pts), { padding: [45, 65] });
			}
			async function liveChangeHole(delta) {
				const round = ROUNDS[ACTIVE.activeRoundId];
				round.currentHole = clamp(
					round.currentHole + delta,
					1,
					round.numHoles,
				);
				await sset("round:" + round.id, round);
				LIVE.lastRec = null;
				clearDispersionMap();
				LIVE.elevPinFor = null;
				renderMapView();
				updateTopbarCtx();
			}

			/* ---------- GPS: one-shot, battery-friendly Caddie positioning ---------- */
			function stopGpsWatch() {
				if (LIVE.watchId != null) { navigator.geolocation.clearWatch(LIVE.watchId); LIVE.watchId = null; }
				LIVE.gpsActive = false;
			}
			function captureGpsOnce() {
				return new Promise((resolve, reject) => {
					if (!navigator.geolocation) return reject(new Error("GPS unavailable on this device."));
					LIVE.gpsBusy = true;
					navigator.geolocation.getCurrentPosition(
						pos => {
							LIVE.gpsBusy = false;
							const accuracy = pos.coords.accuracy;
							if (!Number.isFinite(accuracy) || accuracy > 50) {
								LIVE.gpsError = "GPS accuracy is about ±" + Math.round(accuracy || 0) + " m. Try again for a more precise location.";
								reject(new Error(LIVE.gpsError)); return;
							}
							LIVE.gpsError = null; LIVE.gpsWarning = null; LIVE.gpsActive = true;
							LIVE.myPos = {lat:pos.coords.latitude,lng:pos.coords.longitude}; LIVE.myAcc = accuracy; LIVE.gpsAt = pos.timestamp || Date.now();
							updateLiveGpsMarker(); updateLiveDistPill(); resolve(LIVE.myPos);
						},
						err => { LIVE.gpsBusy=false; LIVE.gpsActive=false; LIVE.gpsError=locationErrorMessage(err); reject(err); },
						{enableHighAccuracy:true, maximumAge:0, timeout:20000}
					);
				});
			}
			async function startCaddie() {
				if (LIVE.pendingShotClub) { toast("Finish the current shot first", "err"); return; }
				const returnToMap = currentView === "map";
				try {
					LIVE.lastRec = null; LIVE.weather = null; LIVE.elevPinFor = null;
					toast("Getting your position…");
					await captureGpsOnce();
					// Render the recommendation once through the existing Caddie engine so the
					// same wind/elevation/club/aim calculations power both Caddie and the map.
					if (returnToMap) { setView("caddie"); await computeAndRenderCaddie(); setView("map"); }
					else { await computeAndRenderCaddie(); }
					reflectShotState();
				} catch(e) {
					if (currentView === "caddie") computeAndRenderCaddie();
					toast(LIVE.gpsError || "Could not get your location", "err");
				}
			}
			function onGpsUpdate(pos) { /* legacy compatibility; Caddie now uses one-shot GPS */ }
			function onGpsError(err) { LIVE.gpsError = locationErrorMessage(err); }

			function updateLiveGpsMarker() {
				if (!LIVE.map || !LIVE.myPos) return;
				if (!LIVE.layers.gps)
					LIVE.layers.gps = L.marker(
						[LIVE.myPos.lat, LIVE.myPos.lng],
						{ icon: gpsIcon(), zIndexOffset: 1000 },
					).addTo(LIVE.map);
				else
					LIVE.layers.gps.setLatLng([LIVE.myPos.lat, LIVE.myPos.lng]);
			}
			function updateLiveDistPill() {
				const pill = document.getElementById("live-dist-pill");
				if (!pill || !ACTIVE.activeRoundId) return;
				const round = ROUNDS[ACTIVE.activeRoundId];
				if (!round) return;
				const course = COURSES[round.courseId];
				if (!course) return;
				const hole = course.holes[round.currentHole - 1];
				if (!hole.pin)
					pill.innerHTML = svgFlagSmall() + " Pin not mapped";
				else if (!LIVE.myPos)
					pill.innerHTML = svgFlagSmall() + " Locating…";
				else
					pill.innerHTML =
						svgFlagSmall() +
						" " +
						Math.round(distYards(LIVE.myPos, hole.pin)) +
						' yds to pin <span style="opacity:.72;">±' +
						Math.round(metersToYards(LIVE.myAcc || 0)) +
						" yd</span>";
			}
			function locationErrorMessage(err) {
				if (err && err.code === 1)
					return "Location permission is off. Allow location access in your browser settings to use live distance and the Smart Caddie.";
				if (err && err.code === 3)
					return "GPS timed out. Move to an open area and check Location Services, then try again.";
				return "GPS is unavailable. Turn on Location Services to use live distance and the Smart Caddie.";
			}

			/* =========================================================================
   SMART CADDIE
   ========================================================================= */
			async function renderCaddie() {
				const root = document.getElementById("view-caddie");
				const round = ACTIVE.activeRoundId ? ROUNDS[ACTIVE.activeRoundId] : null;
				if (!round || round.completed) {
					root.innerHTML = '<div class="empty" style="margin-top:20px;"><b>No round in progress</b>Start a round to use the GPS Caddie.</div><button class="btn btn-primary btn-block" style="margin-top:10px;" data-action="start-round-flow">Start a Round</button>';
					return;
				}
				if (!COURSES[round.courseId]) await loadCourse(round.courseId);
				const course = COURSES[round.courseId];
				if (!course) {
					root.innerHTML = '<div class="empty" style="margin-top:20px;">Could not load this round\'s course.</div>';
					return;
				}
				const hole = course.holes[round.currentHole - 1];
				root.innerHTML =
					'<div class="caddie-hero"><div class="eyebrow">Hole ' + hole.number + ' · Par ' + hole.par + '</div><div class="distbig" id="cd-dist">— <span>yds</span></div><div class="condrow" id="cd-cond"></div></div>' +
					'<div class="rec-card" id="cd-rec"></div><div class="why-box" id="cd-why"></div>' +
					'<div class="caddie-actions"><button class="btn btn-primary btn-block" id="caddie-main" data-action="start-caddie">Start Caddie</button><button class="btn btn-block btn-ghost" data-action="refresh-caddie">Refresh Weather</button></div>' +
					'<div class="shot-state" id="shot-state"></div>';
				reflectShotState();
				if (LIVE.gpsActive) await computeAndRenderCaddie();
				else {
					document.getElementById("cd-dist").innerHTML = '<span>GPS off</span>';
					document.getElementById("cd-cond").innerHTML = '<div style="font-size:11.5px;color:#B7BAC2;">Location is off until you start the Caddie.</div>';
					document.getElementById("cd-rec").innerHTML = '<div class="gps-status-card"><div class="gps-status-title">Battery-friendly GPS</div><div class="gps-status-sub">Start Caddie only when you want a shot recommendation. GPS turns off again after you hit or finish a shot.</div></div>';
				}
			}

			function refreshCaddieWeather() {
				if (!LIVE.gpsActive) { toast("Start Caddie first", "err"); return; }
				LIVE.weatherAt = 0;
				toast("Refreshing…");
				computeAndRenderCaddie();
			}

			async function computeAndRenderCaddie() {
				const distEl = document.getElementById("cd-dist");
				if (!distEl) return; // caddie view not mounted
				const round = ACTIVE.activeRoundId
					? ROUNDS[ACTIVE.activeRoundId]
					: null;
				if (!round) return;
				const course = COURSES[round.courseId];
				if (!course) return;
				const hole = course.holes[round.currentHole - 1];
				const teeInfo = hole.tees[round.teeName] || {};
				const condEl = document.getElementById("cd-cond");
				const recEl = document.getElementById("cd-rec");
				const whyEl = document.getElementById("cd-why");

				if (LIVE.gpsError) {
					distEl.innerHTML =
						(teeInfo.yardage || "—") +
						" <span>yds (hole yardage)</span>";
					condEl.innerHTML = "";
					whyEl.innerHTML = "";
					recEl.innerHTML =
						'<div class="empty">' +
						escapeHtml(LIVE.gpsError) +
						"</div>";
					return;
				}
				if (!LIVE.myPos || !LIVE.gpsActive) {
					distEl.innerHTML = '<span>GPS off</span>';
					condEl.innerHTML = '<div style="font-size:11.5px;color:#B7BAC2;">Start Caddie to get a live recommendation.</div>';
					whyEl.innerHTML = "";
					recEl.innerHTML = '<div class="gps-status-card"><div class="gps-status-title">Ready when you are</div><div class="gps-status-sub">GPS is currently off to save battery.</div></div>';
					return;
				}
				if (!hole.pin) {
					distEl.innerHTML =
						(teeInfo.yardage || "—") +
						" <span>yds (hole yardage — no pin mapped)</span>";
					condEl.innerHTML = "";
					whyEl.innerHTML = "";
					recEl.innerHTML =
						"<div class=\"empty\">This hole's pin hasn't been placed yet. Add it in Course Builder for live distance and club recommendations.</div>";
					return;
				}

				const rawDistYd = distYards(LIVE.myPos, hole.pin);
				const greenPts = (hole.green || []).flat();
				const greenDists = greenPts.length ? greenPts.map(p => distYards(LIVE.myPos,p)) : [];
				const frontYd = greenDists.length ? Math.min(...greenDists) : null;
				const backYd = greenDists.length ? Math.max(...greenDists) : null;
				distEl.innerHTML = Math.round(rawDistYd) + " <span>yds to pin</span>";

				const now = Date.now();
				if (!LIVE.weather || now - LIVE.weatherAt > 2 * 60 * 1000) {
					const w = await fetchWeather(
						LIVE.myPos.lat,
						LIVE.myPos.lng,
					);
					if (w) {
						LIVE.weather = w;
						LIVE.weatherAt = now;
					}
				}
				const elevOrigin = LIVE.elevFor;
				if (
					LIVE.elevPinFor !== hole.number ||
					!elevOrigin ||
					haversineMeters(elevOrigin, LIVE.myPos) > 20
				) {
					const elevs = await fetchElevations([LIVE.myPos, hole.pin]);
					if (elevs) {
						LIVE.elevGolfer = elevs[0];
						LIVE.elevPin = elevs[1];
						LIVE.elevPinFor = hole.number;
						LIVE.elevFor = { ...LIVE.myPos };
					}
				}
				// re-check the dist element still exists (view may have changed during the awaits)
				if (!document.getElementById("cd-dist")) return;

				let windAdjYd = 0,
					elevAdjYd = 0,
					airAdjYd = 0,
					windDesc = "calm",
					elevDesc = "",
					airDesc = "";
				// Wind and air-density effects scale with how long the ball is actually in
				// flight — not with the distance remaining to the pin. On a tee shot that
				// can't reach the green, using the full to-pin distance would overstate
				// both adjustments, so cap the reference distance at the longest club's
				// average carry (you can't fly the ball further than that in one swing).
				const maxReachYd = CLUBS.length
					? Math.max(...CLUBS.map((c) => clubWorkingDistance(c)))
					: rawDistYd;
				const shotRefYd = Math.min(rawDistYd, maxReachYd);
				if (LIVE.weather) {
					const brgToPin = bearingDeg(LIVE.myPos, hole.pin);
					const windTravelTo = (LIVE.weather.windDir + 180) % 360;
					const diff = toRad(windTravelTo - brgToPin);
					const helpComponent =
						LIVE.weather.windSpeed * Math.cos(diff); // >0 tailwind (helps), <0 headwind (hurts)
					// Scale against a 150yd reference shot: a wedge in the same wind moves
					// far less than a driver, since it's airborne for less time.
					const windDistanceFactor = clamp(shotRefYd / 150, 0.3, 1.8);
					windAdjYd = -helpComponent * 1.3 * windDistanceFactor;
					windDesc =
						helpComponent > 1
							? Math.round(helpComponent) + " mph tailwind"
							: helpComponent < -1
								? Math.round(-helpComponent) + " mph headwind"
								: "calm";
					// Air density uses the observed temperature, humidity and surface pressure.
					// It is a more useful physical humidity adjustment than a fixed threshold.
					const density = airDensityKgM3(
						LIVE.weather.temp,
						LIVE.weather.humidity,
						LIVE.weather.pressure,
					);
					airAdjYd = shotRefYd * 0.6 * (density / 1.225 - 1);
					airDesc =
						Math.abs(airAdjYd) >= 1
							? (airAdjYd > 0 ? "dense air +" : "thin air −") +
								Math.abs(Math.round(airAdjYd)) +
								" yd"
							: "";
					condEl.innerHTML =
						"<div><b>" +
						Math.round(LIVE.weather.temp) +
						"&deg;</b><span>Temp</span></div>" +
						"<div><b>" +
						Math.round(LIVE.weather.windSpeed) +
						"mph</b><span>Wind</span></div>" +
						"<div><b>" +
						Math.round(LIVE.weather.humidity) +
						"%</b><span>Humidity</span></div>";
				} else {
					condEl.innerHTML =
						'<div style="font-size:11.5px;color:#B7BAC2;">Weather unavailable — distance-only recommendation</div>';
				}
				if (LIVE.elevGolfer != null && LIVE.elevPin != null) {
					const elevDiffFt =
						(LIVE.elevPin - LIVE.elevGolfer) * 3.28084;
					elevAdjYd = elevDiffFt / 3;
					elevDesc =
						(elevDiffFt >= 0 ? "+" : "") +
						Math.round(elevDiffFt) +
						" ft";
				}

				const adjustedYd = Math.max(
					10,
					rawDistYd + windAdjYd + elevAdjYd + airAdjYd,
				);
				const insideTee = isInsideAnyTeeBox(hole, LIVE.myPos);
				const eligible = CLUBS.filter(
					(c) => !c.requiresTee || insideTee,
				);

				if (!eligible.length) {
					recEl.innerHTML =
						'<div class="empty">' +
						(CLUBS.length
							? "No eligible clubs from here — tee clubs only work inside a mapped tee box."
							: "Add clubs with distances in My Bag to get a recommendation.") +
						"</div>";
					whyEl.innerHTML = "";
				} else {
					const smart = pickSmartPlay(hole, LIVE.myPos, rawDistYd, adjustedYd, eligible, round);
					if (!smart) {
						recEl.innerHTML = '<div class="empty">No safe club/landing plan could be generated from the mapped features. Play conservatively and re-check the course map.</div>';
						whyEl.innerHTML = "";
						return;
					}
					const club = smart.club;
					const aim = smart.aim;
					const swingPct = smart.swingPct;
					const note = smart.note;
					LIVE.lastRec = {
						club,
						swingPct,
						aim,
						adjustedYd,
						rawDistYd,
					};

					const targetYd = Math.round(aim.targetDistanceYd || 0);
					const pinYd = Math.round(distYards(LIVE.myPos, hole.pin));
					const landingYd = Math.round(aim.landingDistanceYd || aim.targetDistanceYd || 0);
					const riskPct = Math.round((aim.risk || 0) * 100);
					const riskBadge = riskPct >= 25
						? '<span class="badge badge-red">Risk '+riskPct+'%</span>'
						: '<span class="badge badge-dark">Risk '+riskPct+'%</span>';

					recEl.innerHTML =
						'<div class="eyebrow">' + (aim.type === "green" ? "GIR ATTEMPT" : "SMART LAYUP") + '</div>' +
						'<div class="rec-club">' + escapeHtml(club.name) + '</div>' +
						'<div class="rec-sub">' +
						Math.round(clubWorkingDistance(club)) + " yds full-swing average · " + riskBadge + '</div>' +
						'<div class="rec-metrics">' +
						"<div><b>" + swingPct + "%</b><span>Swing</span></div>" +
						"<div><b>" + targetYd + "</b><span>Target Yds</span></div>" +
						"<div><b>" + landingYd + "</b><span>Landing Yds</span></div>" +
						"<div><b>" + pinYd + "</b><span>To Pin</span></div>" +
						(frontYd != null ? "<div><b>"+Math.round(frontYd)+"</b><span>Front</span></div>" : "") +
						(backYd != null ? "<div><b>"+Math.round(backYd)+"</b><span>Back</span></div>" : "") +
						"</div>";

					let why =
						"Playing " + Math.round(adjustedYd) + " effective yards to the pin.";
					if (windDesc !== "calm")
						why += " " + windDesc[0].toUpperCase() + windDesc.slice(1) + " factored in.";
					if (elevDesc)
						why += " Elevation change to the green is " + elevDesc + ".";
					if (airDesc)
						why += " " + airDesc[0].toUpperCase() + airDesc.slice(1) + ".";
					why += " " + aim.reason;
					why += " Target is " + targetYd + " yards away and the landing point is " + landingYd + " yards from you.";
					if (aim.type === "green") {
						why += " Smart Caddie is intentionally targeting the green rather than the pin.";
					} else {
						why += " The direct GIR route was not safe enough, so this is a layup play.";
					}
					if (!insideTee && CLUBS.some((c) => c.requiresTee))
						why += " Tee clubs are excluded — you're not inside a mapped tee box.";
					if (note) why += " " + note;
					whyEl.innerHTML = "<b>Why?</b> " + escapeHtml(why);
					updateLiveMapRecommendation();
				}
			}
			function isInsideAnyTeeBox(hole, pos) {
				return Object.values(hole.tees).some(
					(t) =>
						t &&
						t.lat != null &&
						haversineMeters(pos, t) <=
							yardsToMeters(t.radius || 25),
				);
			}
			function pickClub(eligible, targetYd) {
				const sorted = eligible.slice().sort((a, b) => clubWorkingDistance(a) - clubWorkingDistance(b));
				let choice = null;
				for (const c of sorted) {
					if (clubWorkingDistance(c) * 0.97 >= targetYd) {
						choice = c;
						break;
					}
				}
				let note = "";
				if (!choice) {
					choice = sorted[sorted.length - 1];
					if (clubWorkingDistance(choice) < targetYd)
						note =
							"This is beyond your longest club's average — a full, committed swing.";
				}
				const swingPct = clamp(
					Math.round((targetYd / clubWorkingDistance(choice)) * 100),
					55,
					100,
				);
				return { club: choice, swingPct, note };
			}
			
			/* ---------- Smart Caddie strategy engine ---------- */
			function pointInPolygonGeo(point, poly) {
				if (!Array.isArray(poly) || poly.length < 3) return false;
				let inside = false;
				const x = Number(point.lng), y = Number(point.lat);
				for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
					const xi = Number(poly[i].lng), yi = Number(poly[i].lat);
					const xj = Number(poly[j].lng), yj = Number(poly[j].lat);
					const intersects = ((yi > y) !== (yj > y)) &&
						x < ((xj - xi) * (y - yi)) / ((yj - yi) || 1e-15) + xi;
					if (intersects) inside = !inside;
				}
				return inside;
			}

			function orientationGeo(a, b, c) {
				const v = (Number(b.lng) - Number(a.lng)) * (Number(c.lat) - Number(a.lat))
					- (Number(b.lat) - Number(a.lat)) * (Number(c.lng) - Number(a.lng));
				return Math.abs(v) < 1e-12 ? 0 : v > 0 ? 1 : 2;
			}
			function onSegmentGeo(a, b, p) {
				return Number(p.lng) <= Math.max(Number(a.lng), Number(b.lng)) + 1e-12 &&
					Number(p.lng) + 1e-12 >= Math.min(Number(a.lng), Number(b.lng)) &&
					Number(p.lat) <= Math.max(Number(a.lat), Number(b.lat)) + 1e-12 &&
					Number(p.lat) + 1e-12 >= Math.min(Number(a.lat), Number(b.lat));
			}
			function segmentsIntersectGeo(a, b, c, d) {
				const o1 = orientationGeo(a,b,c), o2 = orientationGeo(a,b,d);
				const o3 = orientationGeo(c,d,a), o4 = orientationGeo(c,d,b);
				if (o1 !== o2 && o3 !== o4) return true;
				if (o1 === 0 && onSegmentGeo(a,b,c)) return true;
				if (o2 === 0 && onSegmentGeo(a,b,d)) return true;
				if (o3 === 0 && onSegmentGeo(c,d,a)) return true;
				if (o4 === 0 && onSegmentGeo(c,d,b)) return true;
				return false;
			}

			function polygonPathProfile(origin, target, poly) {
				if (!Array.isArray(poly) || poly.length < 3) return null;
				const targetBearing = bearingDeg(origin, target);
				const targetDist = haversineMeters(origin, target);
				let minAlong = Infinity, maxAlong = -Infinity, minLat = Infinity, maxLat = -Infinity;
				for (const pt of poly) {
					const off = lateralOffset(origin, target, pt);
					minAlong = Math.min(minAlong, off.along);
					maxAlong = Math.max(maxAlong, off.along);
					minLat = Math.min(minLat, off.lateral);
					maxLat = Math.max(maxLat, off.lateral);
				}
				const intersects = pointInPolygonGeo(origin, poly) || pointInPolygonGeo(target, poly) ||
					poly.some((pt, i) => segmentsIntersectGeo(origin, target, pt, poly[(i+1)%poly.length]));
				return {
					intersects,
					minAlong,
					maxAlong,
					minLat,
					maxLat,
					targetDist,
					targetBearing
				};
			}

			function smartHazardList(hole) {
				const known = ["water","bunkers","ob","obstacles","trees","penalty","hazards"];
				const keys = [];
				known.forEach(k => { if (Array.isArray(hole && hole[k])) keys.push(k); });
				return keys;
			}
			function hazardDisplayName(type) {
				return ({
					water:"water", bunkers:"bunker", ob:"out of bounds",
					obstacles:"obstacle", trees:"trees", penalty:"penalty area", hazards:"hazard"
				})[type] || type;
			}
			function hazardSeverity(type) {
				return type === "water" || type === "ob" || type === "penalty" ? 1.35 : 0.85;
			}

			function todayClubCarries(club, round) {
				const today = new Date().toDateString();
				const shots = Array.isArray(round && round.shots) ? round.shots : [];
				return shots.filter(s => s && s.fullSwing === true &&
					(s.clubId === club.id || s.club === club.name) &&
					s.timestamp && new Date(s.timestamp).toDateString() === today &&
					Number(s.distanceYd) > 0).map(s => Number(s.distanceYd));
			}
			function todayCarryStats(club, round) {
				const ds = todayClubCarries(club, round);
				if (ds.length < 3) return { reliable:false, samples:ds.length, avg:0, min:0, max:0, sd:0 };
				const avg = ds.reduce((a,b)=>a+b,0) / ds.length;
				const sd = stdev(ds);
				const min = Math.min(...ds), max = Math.max(...ds);
				return {
					reliable: sd <= 12 && min >= avg - 15,
				samples: ds.length, avg, min, max, sd
				};
			}
			function todayCarryEvidence(club, round, requiredYd) {
				const ds = todayClubCarries(club, round);
				if (ds.length < 3) return { reliable:false, samples:ds.length, carry:0, hitRate:0 };
				const margin = 5;
				const clears = ds.filter(d => d >= requiredYd + margin).length;
				const hitRate = clears / ds.length;
				const avg = ds.reduce((a,b)=>a+b,0) / ds.length;
				return {
					reliable: hitRate >= 0.67 && avg >= requiredYd + margin,
					samples: ds.length,
					carry: avg,
					hitRate
				};
			}
			function hazardPathAssessment(origin, target, club, round) {
				const d = (club && club.dispersion) || {};
				const lr = clamp(Number(d.lr) || 3, 3, 18);
				const offsets = [0, -0.5*lr, 0.5*lr, -lr, lr];
				const hazards = [];
				const types = smartHazardList(holeForStrategy);
				return { hazards, types };
			}

			/* Evaluate every mapped hazard against a shot ray. A hazard can be
			   crossed safely when the ball's expected/reliably observed carry gets
			   beyond its far edge by a safety margin. */
			function assessHazardsForRay(hole, origin, target, club, round) {
				const result = { risk:0, risky:[], cleared:[], crossed:[] };
				const targetDistYd = distYards(origin, target);
				const carryYd = Math.max(1, targetDistYd);
				const types = smartHazardList(hole);
				let weightedRisk = 0, totalSeverity = 0;

				for (const type of types) {
					for (const poly of (hole[type] || [])) {
						const prof = polygonPathProfile(origin, target, poly);
						if (!prof || !prof.intersects) continue;
						const minYd = metersToYards(prof.minAlong);
						const maxYd = metersToYards(prof.maxAlong);
						const severity = hazardSeverity(type);
						totalSeverity += severity;
						result.crossed.push({type, poly, minYd, maxYd});

						if (pointInPolygonGeo(target, poly) || maxYd >= targetDistYd - 2) {
							weightedRisk += severity;
							result.risky.push({type, minYd, maxYd, reason:"landing"});
							continue;
						}

						const required = Math.max(0, maxYd) + 8;
						const evidence = todayCarryEvidence(club, round, required);
						const averageSafe = carryYd >= required + 10;
						if (targetDistYd >= required && (evidence.reliable || averageSafe)) {
							result.cleared.push({
								type, minYd, maxYd, required,
								evidence
							});
						} else {
							weightedRisk += severity;
							result.risky.push({type, minYd, maxYd, required, evidence});
						}
					}
				}
				result.risk = totalSeverity ? clamp(weightedRisk / totalSeverity, 0, 1) : 0;
				return result;
			}

			function assessHazardsWithDispersion(hole, origin, target, club, round) {
				const d = (club && club.dispersion) || {};
				const lr = clamp(Number(d.lr) || 3, 3, 18);
				const bearing = bearingDeg(origin, target);
				const rays = [0, -0.5*lr, 0.5*lr, -lr, lr].map(off => {
					const rayTarget = off === 0 ? target :
						destPoint(target, (bearing + 90 * (off < 0 ? -1 : 1) + 360) % 360, yardsToMeters(Math.abs(off)));
					return assessHazardsForRay(hole, origin, rayTarget, club, round);
				});
				const risky = [];
				const cleared = [];
				rays.forEach(r => {
					r.risky.forEach(h => risky.push(h));
					r.cleared.forEach(h => cleared.push(h));
				});
				const risk = rays.reduce((a,r) => a + r.risk, 0) / Math.max(1, rays.length);
				return { risk:clamp(risk,0,1), risky, cleared, rays };
			}

			function greenTargetCandidates(hole, pin) {
				const out = [];
				const add = p => {
					if (!p || p.lat == null || p.lng == null) return;
					if ((hole.green || []).some(poly => pointInPolygonGeo(p, poly))) {
						if (!out.some(q => haversineMeters(q,p) < 1.5)) out.push({lat:Number(p.lat),lng:Number(p.lng)});
					}
				};
				if (pin) add(pin);
				(hole.green || []).forEach(poly => {
					if (!Array.isArray(poly) || poly.length < 3) return;
					add(polygonCentroid(poly));
					poly.forEach(add);
					const lats = poly.map(p=>Number(p.lat)), lngs = poly.map(p=>Number(p.lng));
					const minLat=Math.min(...lats), maxLat=Math.max(...lats), minLng=Math.min(...lngs), maxLng=Math.max(...lngs);
					for(let yi=1;yi<=7;yi++){
						for(let xi=1;xi<=7;xi++){
							add({
								lat:minLat+(maxLat-minLat)*(yi/8),
								lng:minLng+(maxLng-minLng)*(xi/8)
							});
						}
					}
				});
				return out;
			}
			function fairwayTargetCandidates(hole) {
				const out = [];
				const add = p => {
					if (!p || p.lat == null || p.lng == null) return;
					if ((hole.fairway || []).some(poly => pointInPolygonGeo(p, poly))) {
						if (!out.some(q => haversineMeters(q,p) < 2)) out.push({lat:Number(p.lat),lng:Number(p.lng)});
					}
				};
				(hole.fairway || []).forEach(poly => {
					if (!Array.isArray(poly) || poly.length < 3) return;
					add(polygonCentroid(poly));
					poly.forEach(add);
					const lats=poly.map(p=>Number(p.lat)), lngs=poly.map(p=>Number(p.lng));
					const minLat=Math.min(...lats), maxLat=Math.max(...lats), minLng=Math.min(...lngs), maxLng=Math.max(...lngs);
					for(let yi=1;yi<=5;yi++) for(let xi=1;xi<=5;xi++)
						add({lat:minLat+(maxLat-minLat)*(yi/6),lng:minLng+(maxLng-minLng)*(xi/6)});
				});
				return out;
			}
			function greenEdgeMarginYd(point, hole) {
				let best = Infinity;
				(hole.green || []).forEach(poly => {
					if (!pointInPolygonGeo(point, poly)) return;
					for(let i=0;i<poly.length;i++){
						const a=poly[i], b=poly[(i+1)%poly.length];
						const lat0=toRad(point.lat), scale=111320*Math.cos(lat0);
						const ax=(Number(a.lng)-point.lng)*scale, ay=(Number(a.lat)-point.lat)*111320;
						const bx=(Number(b.lng)-point.lng)*scale, by=(Number(b.lat)-point.lat)*111320;
						const vx=bx-ax, vy=by-ay, wx=-ax, wy=-ay;
						const t=clamp((wx*vx+wy*vy)/(vx*vx+vy*vy || 1),0,1);
						const dx=ax+vx*t, dy=ay+vy*t;
						best=Math.min(best, metersToYards(Math.hypot(dx,dy)));
					}
				});
				return isFinite(best) ? best : 0;
			}
			function pinRelativeOffsetYd(origin, pin, point) {
				if (!pin || !point) return {leftRight:0, longShort:0};
				const off=lateralOffset(origin,pin,point);
				return {leftRight:metersToYards(off.lateral), longShort:metersToYards(off.along)-distYards(origin,pin)};
			}

			function makeAimLabel(type, origin, pin, target) {
				const off = pinRelativeOffsetYd(origin,pin,target);
				if (type === "green") {
					if (Math.abs(off.leftRight) < 1.5) return "Green · Pin line";
					return "Green · " + Math.round(Math.abs(off.leftRight)) + "yd " + (off.leftRight > 0 ? "right" : "left");
				}
				return "Layup · " + Math.round(distYards(origin,target)) + "yd";
			}

			function analyzeSmartAim(hole, golferPos, rawDistYd, adjustedYd, club, round) {
				const carry = clubWorkingDistance(club);
				if (!(carry > 0)) return null;
				const todayCarry = todayCarryStats(club, round);
				const planningCarry = todayCarry.reliable ? Math.max(carry, todayCarry.avg) : carry;
				const correction = adjustedYd - rawDistYd;
				const greenCandidates = greenTargetCandidates(hole, hole.pin);
				const greenOptions = [];

				for (const target of greenCandidates) {
					const geometric = distYards(golferPos,target);
					const effective = Math.max(1, geometric + correction);
					if (effective > planningCarry * 0.995) continue;
					const hz = assessHazardsWithDispersion(hole,golferPos,target,club,round);
					const edge = greenEdgeMarginYd(target,hole);
					const pinDist = distYards(target,hole.pin);
					const dispersionPenalty = edge < 6 ? (6-edge)*8 : 0;
					/* A full-swing recommendation should actually be a full-swing play.
					   If the target is dramatically shorter than the club's carry, a 65%
					   swing may technically reach it, but that is not the default smart
					   play. Prefer a target that the club can reach with roughly 82–100%
					   of its reliable carry. Controlled swings remain available when no
					   full-swing target exists. */
					const fullSwingFit = effective >= planningCarry * 0.82 && effective <= planningCarry * 1.01;
					const score = pinDist*1.35 + hz.risk*180 + dispersionPenalty - Math.min(edge,15)*0.8 - (fullSwingFit ? 35 : 0);
					greenOptions.push({
					target, geometric, effective, hz, edge, pinDist, score, fullSwingFit,
					swingPct:fullSwingFit ? 100 : clamp(Math.round((effective/planningCarry)*100),75,100)
					});
				}

				if (greenOptions.length) {
					/* Prefer a true full-swing GIR when one exists. This prevents the
					   Caddie from choosing an arbitrary 60–70% swing simply because the
					   pin is closer to the front of a large green. */
					const fullSwingOptions = greenOptions.filter(o => o.fullSwingFit && o.hz.risk < 0.25);
					if (fullSwingOptions.length) greenOptions = fullSwingOptions;
					greenOptions.sort((a,b)=>a.score-b.score);
					const best=greenOptions[0];
					const clearedNames=[...new Set(best.hz.cleared.map(hazardDisplayName))];
					const riskyNames=[...new Set(best.hz.risky.map(h=>hazardDisplayName(h.type)))];
					let reason = "GIR target: aiming for the safest playable part of the green, not automatically at the pin.";
					if (best.pinDist < 3) reason = "GIR target: the pin is the safest useful target, so Smart Caddie is staying on the pin line.";
					else reason += " Target is " + Math.round(best.pinDist) + " yards from the pin.";
					if (best.edge < 6) reason += " The target is kept away from the green edge.";
					if (todayCarry.reliable && todayCarry.avg > carry + 3)
						reason += " Today's " + todayCarry.samples + " logged full swings support about " + Math.round(todayCarry.avg) + " yards with this club, so that carry evidence is being used." ;
					if (clearedNames.length) reason += " " + clearedNames.join(" and ") + " can be cleared with this play.";
					if (riskyNames.length) reason += " " + riskyNames.join(", ") + " remain in the dispersion zone, so the target is being shifted for safety.";
					return {
						type:"green",
						goal:"GIR",
						targetPoint:best.target,
						landingPoint:best.target,
						targetDistanceYd:best.geometric,
						landingDistanceYd:best.geometric,
						effectiveDistanceYd:best.effective,
						swingPct:best.swingPct,
						risk:best.hz.risk,
						label:makeAimLabel("green",golferPos,hole.pin,best.target),
						reason,
						hazards:best.hz,
						pinDistanceYd:best.pinDist
					};
				}

				/* No safe GIR option with this club. Prefer a mapped fairway landing,
				   and put the ball short of the first genuinely blocking hazard. */
				const fwCandidates=fairwayTargetCandidates(hole);
				const desired=Math.min(planningCarry*0.92, Math.max(70, adjustedYd-35));
				let options=[];
				for(const target of fwCandidates){
					const geometric=distYards(golferPos,target);
					if(geometric > planningCarry*0.995 || geometric < 35) continue;
					const hz=assessHazardsWithDispersion(hole,golferPos,target,club,round);
					const fairwayCenterPenalty=Math.abs(lateralOffset(golferPos,hole.pin,target).lateral)/yardsToMeters(1)*0.35;
					const score=hz.risk*1200 + Math.abs(geometric-desired)*0.9 + fairwayCenterPenalty;
					options.push({target,geometric,hz,score});
				}
				if(!options.length){
					const brg=bearingDeg(golferPos,hole.pin);
					for(let dist=Math.min(planningCarry*0.88,Math.max(55,desired));dist>=45;dist-=10){
						for(const off of [-15,-8,0,8,15]){
							const base=destPoint(golferPos,brg,yardsToMeters(dist));
							const target=destPoint(base,(brg+90*(off<0?-1:1)+360)%360,yardsToMeters(Math.abs(off)));
							const hz=assessHazardsWithDispersion(hole,golferPos,target,club,round);
							options.push({target,geometric:dist,hz,score:hz.risk*1400+Math.abs(dist-desired)*0.8+Math.abs(off)*0.2});
						}
					}
				}
				options.sort((a,b)=>a.score-b.score);
				const best=options[0];
				if(!best) return null;
				const risky=[...new Set(best.hz.risky.map(h=>hazardDisplayName(h.type)))];
				const cleared=[...new Set(best.hz.cleared.map(h=>hazardDisplayName(h.type)))];
				let reason="GIR is not safely reachable with this club, so Smart Caddie is selecting the best low-risk layup position.";
				if(risky.length) reason += " " + risky.join(", ") + " block the aggressive route.";
				if(cleared.length) reason += " " + cleared.join(" and ") + " are considered clearable based on the club's carry.";
				reason += " Lay up in play at about " + Math.round(best.geometric) + " yards.";
				return {
					type:"layup",
					goal:"LAYUP",
					targetPoint:best.target,
					landingPoint:best.target,
					targetDistanceYd:best.geometric,
					landingDistanceYd:best.geometric,
					effectiveDistanceYd:Math.max(1,best.geometric+correction),
					swingPct:clamp(Math.round(((best.geometric+correction)/planningCarry)*100),65,100),
					risk:best.hz.risk,
					label:makeAimLabel("layup",golferPos,hole.pin,best.target),
					reason,
					hazards:best.hz,
					pinDistanceYd:distYards(best.target,hole.pin)
				};
			}

			function pickSmartPlay(hole, golferPos, rawDistYd, adjustedYd, eligible, round) {
				const candidates=[];
				for(const club of eligible){
					if(club.type==="Putter" && rawDistYd>45) continue;
					const aim=analyzeSmartAim(hole,golferPos,rawDistYd,adjustedYd,club,round);
					if(!aim) continue;
					let score=0;
					if(aim.type==="green"){
						/* GIR is the first priority. Among safe GIR plays, prefer a genuine
						   full-swing play, then prefer the longest eligible club. This is
						   especially important when the golfer is not inside a tee box:
						   tee-only clubs are already excluded, so the longest legal club
						   should not mysteriously become a 65% shot. */
						score=10000 - aim.pinDistanceYd*20 - aim.risk*5000;
						if(aim.swingPct >= 99) score += 900 + carryForScore(club)*2;
						else score += aim.swingPct*1.5;
						score += Math.min(aim.hazards.cleared.length,3)*40;
					}else{
						score=4500 + Math.min(aim.landingDistanceYd,carryForScore(club))*3 - aim.risk*5000 - Math.abs(aim.swingPct-90)*4;
					}
					candidates.push({club,aim,score});
				}
				if(!candidates.length) return null;
				candidates.sort((a,b)=>b.score-a.score);
				const best=candidates[0];
				return {
					club:best.club,
					aim:best.aim,
					swingPct:best.aim.swingPct,
					note: best.aim.type==="green" ? "Smart Caddie is prioritizing a safe GIR over a direct pin attack." : "Smart Caddie is choosing a controlled layup because the direct GIR route is too risky."
				};
			}
			function carryForScore(club){ return Math.max(1,clubWorkingDistance(club)); }

			function computeAim(hole, golferPos, distToPinYd, expectedShotYd, club) {
				/* Backward-compatible wrapper for any older caller. The live Caddie now
				   uses the full strategy engine above. */
				const round = ACTIVE.activeRoundId ? ROUNDS[ACTIVE.activeRoundId] : null;
				const raw = Number(distToPinYd) || distYards(golferPos,hole.pin);
				const adjusted = raw + (Number(expectedShotYd)||0 - clubWorkingDistance(club));
				return analyzeSmartAim(hole,golferPos,raw,adjusted,club,round) || {
					type:"layup", goal:"LAYUP", targetPoint:destPoint(golferPos,bearingDeg(golferPos,hole.pin),yardsToMeters(Math.min(expectedShotYd,raw))),
					landingPoint:destPoint(golferPos,bearingDeg(golferPos,hole.pin),yardsToMeters(Math.min(expectedShotYd,raw))),
					targetDistanceYd:Math.min(expectedShotYd,raw), landingDistanceYd:Math.min(expectedShotYd,raw),
					effectiveDistanceYd:Math.min(expectedShotYd,raw), swingPct:100, risk:1,
					label:"Layup", reason:"No safe mapped target was available."
				};
			}
			function clearDispersionMap(){
				if(LIVE.layers && LIVE.layers.dispersion){
					try { LIVE.layers.dispersion.remove(); } catch(e){}
					LIVE.layers.dispersion = null;
				}
			}
			function drawDispersionMap(club, landing, shotBearing){
				clearDispersionMap();
				if(!LIVE.map || !club || !landing) return;
				normalizeClub(club);
				const d = club.dispersion || {};
				if(Number(club.shotsRecorded||0) < 3) return;
				const lr = Math.max(3, Math.min(15, Number(d.lr||0)));
				const ls = Math.max(3, Math.min(25, Number(d.ls||0)));
				if(!(lr > 0 || ls > 0)) return;
				const pts=[];
				for(let i=0;i<=48;i++){
					const t=(Math.PI*2*i)/48;
					const cross=Math.cos(t)*lr;
					const along=Math.sin(t)*ls;
					const crossPoint=destPoint(landing,(shotBearing+90+360)%360,yardsToMeters(cross));
					const finalPoint=destPoint(crossPoint,shotBearing,yardsToMeters(along));
					pts.push([finalPoint.lat,finalPoint.lng]);
				}
				const group=L.layerGroup();
				L.polygon(pts,{weight:2,opacity:.8,fillOpacity:.12,dashArray:'6 5',interactive:false}).addTo(group);
				L.circleMarker([landing.lat,landing.lng],{radius:5,weight:2,fillOpacity:.9,interactive:false}).addTo(group);
				group.addTo(LIVE.map);
				LIVE.layers.dispersion=group;
			}

			function updateLiveMapRecommendation() {
				if (!LIVE.map || !LIVE.lastRec || !LIVE.myPos) return;
				const round = ROUNDS[ACTIVE.activeRoundId];
				if (!round) return;
				const course = COURSES[round.courseId];
				const hole = course && course.holes[round.currentHole - 1];
				if (!hole || !hole.pin) return;

				const aim = LIVE.lastRec.aim || {};
				const target = aim.targetPoint || hole.pin;
				const landing = aim.landingPoint || target;
				const shotBearing = bearingDeg(LIVE.myPos, target);

				if (!LIVE.layers.landing)
					LIVE.layers.landing = L.marker([landing.lat, landing.lng], {
						icon: landingIcon(),
					}).addTo(LIVE.map);
				else LIVE.layers.landing.setLatLng([landing.lat, landing.lng]);

				if (!LIVE.layers.aimLine)
					LIVE.layers.aimLine = L.polyline([], {
						weight:3, dashArray:'8 7', opacity:.9
					}).addTo(LIVE.map);
				LIVE.layers.aimLine.setLatLngs([
					[LIVE.myPos.lat,LIVE.myPos.lng],
					[target.lat,target.lng]
				]);

				/* Keep the dispersion footprint aligned to the actual smart target,
				   not automatically to the pin. */
				drawDispersionMap(LIVE.lastRec.club, landing, shotBearing);
			}


			/* ---------- weather / elevation (Open-Meteo, free, no key) ---------- */
			async function fetchWeather(lat, lng) {
				try {
					const res = await fetch(
						"https://api.open-meteo.com/v1/forecast?latitude=" +
							lat +
							"&longitude=" +
							lng +
							"&current=temperature_2m,relative_humidity_2m,surface_pressure,wind_speed_10m,wind_direction_10m&temperature_unit=fahrenheit&wind_speed_unit=mph",
					);
					if (!res.ok) throw 0;
					const d = await res.json();
					return {
						temp: d.current.temperature_2m,
						humidity: d.current.relative_humidity_2m,
						pressure: d.current.surface_pressure,
						windSpeed: d.current.wind_speed_10m,
						windDir: d.current.wind_direction_10m,
						observedAt: d.current.time,
					};
				} catch (e) {
					return null;
				}
			}
			function airDensityKgM3(tempF, humidityPct, pressureHpa) {
				const tempC = ((tempF - 32) * 5) / 9,
					tempK = tempC + 273.15;
				const vaporHpa =
					(clamp(humidityPct, 0, 100) / 100) *
					6.1078 *
					Math.pow(10, (7.5 * tempC) / (237.3 + tempC));
				const pressurePa = (Number(pressureHpa) || 1013.25) * 100,
					vaporPa = vaporHpa * 100;
				return (
					(pressurePa - vaporPa) / (287.05 * tempK) +
					vaporPa / (461.495 * tempK)
				);
			}
			async function fetchElevations(points) {
				try {
					const lat = points.map((p) => p.lat).join(","),
						lng = points.map((p) => p.lng).join(",");
					const res = await fetch(
						"https://api.open-meteo.com/v1/elevation?latitude=" +
							lat +
							"&longitude=" +
							lng,
					);
					if (!res.ok) throw 0;
					const d = await res.json();
					return d.elevation;
				} catch (e) {
					return null;
				}
			}

			/* ---------- battery-friendly shot logging ---------- */
			function openHitShotModal() {
				if (!LIVE.gpsActive || !LIVE.myPos) { toast("Start Caddie first", "err"); return; }
				if (!CLUBS.length) { toast("Add clubs in My Bag first", "err"); return; }
				const recommended = LIVE.lastRec && LIVE.lastRec.club ? LIVE.lastRec.club.id : null;
				showModal('<h3 class="modal-title">What club did you hit?</h3><p style="font-size:12px;color:var(--ink-soft);margin-bottom:10px;">Your start location will be saved, then GPS turns off while you walk to the ball.</p><div class="field"><div class="chiprow">' + CLUBS.map(c => '<button type="button" class="chip' + (c.id===recommended?' tee-active':'') + '" data-log-club="'+c.id+'">'+escapeHtml(c.name)+'</button>').join('') + '</div></div><div class="modal-actions"><button class="btn btn-primary btn-block" data-action="confirm-hit-shot">Hit Shot</button></div>', root => {
					root.querySelectorAll('[data-log-club]').forEach(b => b.addEventListener('click', () => { root.querySelectorAll('[data-log-club]').forEach(x=>x.classList.remove('tee-active')); b.classList.add('tee-active'); }));
				});
			}
			function confirmHitShot() {
				const btn = document.querySelector('[data-log-club].tee-active');
				if (!btn) { toast("Pick a club", "err"); return; }
				if (!LIVE.myPos || !LIVE.gpsActive) { toast("Start Caddie first", "err"); return; }
				const club = CLUBS.find(c=>c.id===btn.dataset.logClub); if (!club) return;
				LIVE.pendingShotClub = club; LIVE.shotStart = {...LIVE.myPos}; LIVE.shotStartAcc = LIVE.myAcc; LIVE.shotStartAt = Date.now();
				stopGpsWatch(); closeModal(); renderMapView(); if (currentView === "caddie") renderCaddie();
				toast(club.name + ' — start saved. GPS off until you finish the shot.', 'ok');
			}
			async function finishShot() {
				if (!LIVE.pendingShotClub || !LIVE.shotStart) return;
				try {
					toast("Getting your landing location…");
					const end = await captureGpsOnce();
					const club = LIVE.pendingShotClub, start = LIVE.shotStart;
					const distYd = metersToYards(haversineMeters(start,end));
					const round = ROUNDS[ACTIVE.activeRoundId]; const course = COURSES[round.courseId]; const hole = course.holes[round.currentHole-1];
					let lateral=0, along=distYd; if (hole.pin) { const off=lateralOffset(start,hole.pin,end); lateral=metersToYards(off.lateral); along=metersToYards(off.along); }
					const shot = {hole:hole.number,club:club.name,clubId:club.id,start,end,distanceYd:Math.round(distYd),lateralYd:Math.round(lateral),alongYd:Math.round(along),timestamp:todayISO(),fullSwing:false,excludedFromClubAverage:false};
					round.shots = round.shots || []; round.shots.push(shot);
					LIVE.pendingShotClub=null; LIVE.shotStart=null; LIVE.shotStartAcc=null; LIVE.shotStartAt=null; stopGpsWatch();
					await sset('round:'+round.id,round);
					if (isFullSwingCandidate(club,distYd)) {
						LIVE.pendingAverageShot={clubId:club.id,distanceYd:distYd,lateral,along,targetDistanceYd:hole.pin?metersToYards(haversineMeters(start,hole.pin)):distYd,shotIndex:round.shots.length-1};
						openFullSwingConfirmModal();
					} else {
						club.partialShots = Number(club.partialShots||0)+1; shot.excludedFromClubAverage=true; shot.fullSwing=false; await sset('clubs',CLUBS); await sset('round:'+round.id,round); reflectShotState(); toast(club.name+' '+Math.round(distYd)+' yds saved as a partial/short shot.', 'ok');
						if (currentView==='bag') renderBag();
						if (currentView==='map') renderMapView();
					}
				} catch(e) { toast(LIVE.gpsError || 'Could not get the shot finish location', 'err'); }
			}
			function openFullSwingConfirmModal() {
				const p=LIVE.pendingAverageShot; const club=CLUBS.find(c=>c.id===p.clubId);
				showModal('<h3 class="modal-title">Track this full-swing shot?</h3><p style="font-size:13px;color:var(--ink-soft);">'+escapeHtml(club.name)+' measured '+Math.round(p.distanceYd)+' yards. This shot is close to your normal full-swing distance, so it can improve your club numbers.</p><div class="modal-actions"><button class="btn" data-action="skip-full-swing">Save shot only</button><button class="btn btn-primary" data-action="save-full-swing">Add to club data</button></div>');
			}
			async function savePendingFullSwing(include) {
				const p=LIVE.pendingAverageShot; if (!p) return; const club=CLUBS.find(c=>c.id===p.clubId); const round=ROUNDS[ACTIVE.activeRoundId];
				if (club && round) { const shot=round.shots[p.shotIndex]; if (include) {
						addFullSwingShotToClub(club,p.distanceYd,p.lateral,p.along,p.targetDistanceYd);
						shot.fullSwing=true;
						shot.excludedFromClubAverage=false;
						shot.lateralYd=Math.round(p.lateral);
						shot.alongYd=Math.round(p.along);
						shot.targetDistanceYd=Math.round(p.targetDistanceYd);
					} else {
						club.partialShots=Number(club.partialShots||0)+1;
						shot.fullSwing=false;
						shot.excludedFromClubAverage=true;
					} await sset('clubs',CLUBS); await sset('round:'+round.id,round); }
				LIVE.pendingAverageShot=null; closeModal(); reflectShotState();
				toast(include ? club.name+' added to full-swing data.' : 'Shot saved without changing your full-swing average.', 'ok');
				if (currentView==='bag') renderBag(); if (currentView==='map') renderMapView();
			}

			function stdev(arr) {
				if (arr.length < 2) return 0;
				const m = arr.reduce((a, b) => a + b, 0) / arr.length;
				return Math.sqrt(
					arr.reduce((a, b) => a + (b - m) * (b - m), 0) / arr.length,
				);
			}
			function reflectShotState() {
				const main=document.getElementById('caddie-main'); const state=document.getElementById('shot-state');
				if (main) {
					if (LIVE.pendingShotClub) { main.dataset.action='finish-shot'; main.textContent='Finish Shot'; main.classList.add('primary'); }
					else if (LIVE.gpsActive) { main.dataset.action='hit-shot'; main.textContent='Hit Shot'; main.classList.add('primary'); }
					else { main.dataset.action='start-caddie'; main.textContent='Start Caddie'; main.classList.remove('primary'); }
				}
				if (state) {
					state.innerHTML = LIVE.pendingShotClub ? '<b>'+escapeHtml(LIVE.pendingShotClub.name)+'</b> · start saved · GPS off. Walk to your ball, then finish the shot.' : (LIVE.gpsActive ? '<b>GPS active for this shot setup</b> · tap Hit Shot to save your start location and turn GPS off.' : 'GPS off · no battery-draining tracking is running.');
				}
			}

		</script>

		<script>

				let html =
					'<div class="section-title"><h2>' +

					round.players.forEach((p, pi) => {

							'<td class="editable" data-action="edit-hole" data-player="' +

			async function updateRoundIndex(round) {
				const idxItem = ROUNDS_INDEX.find((r) => r.id === round.id);

				if (idxItem) {
					const p0 = round.players[0];

					const par = (course ? course.holes : []).reduce(
						(sum, h, i) => sum + (p0.scores[i] != null ? h.par : 0),
						0,
					);
					idxItem.scoreRel = total - par;
					idxItem.teeName = roundTeeLabel(round);
					await sset("rounds-index", ROUNDS_INDEX);
				}

			async function loadRoundById(id) {
				const key = String(id);

				// First use any complete round already loaded in this browser. This is
				// important because the history index and the cloud record can briefly
				// get out of sync after an older app version or a sync failure.
				if (ROUNDS[key] && ROUNDS[key].players && ROUNDS[key].courseId) return ROUNDS[key];

				let localRound = null;
				try {
					const raw = localStorage.getItem(STORAGE_PREFIX + "round:" + key);
					if (raw) localRound = JSON.parse(raw);
				} catch (_) {}
				if (localRound && localRound.players && localRound.courseId) {
					localRound.id = key;
					ROUNDS[key] = localRound;
					return localRound;
				}

				// Try Supabase next. A failed cloud lookup must NOT destroy a usable
				// local copy or make the Edit button unusable.
				if (SB && AUTH_USER && navigator.onLine) {
					try {
						const rows = await cloudRows();
						const exact = rows.find(r => String(r.key) === "round:" + key);
						if (exact && exact.value) {
							const round = exact.value;
							round.id = key;
							ROUNDS[key] = round;
							try { localStorage.setItem(STORAGE_PREFIX + "round:" + key, JSON.stringify(round)); } catch (_) {}
							return round;
						}

						// Recover rounds saved under older key formats.
						const legacy = rows.find(r =>
							["round-" + key, "round_" + key].includes(String(r.key)) ||
							(r.value && String(r.value.id) === key)
						);
						if (legacy && legacy.value) {
							const round = legacy.value;
							round.id = key;
							ROUNDS[key] = round;
							try { localStorage.setItem(STORAGE_PREFIX + "round:" + key, JSON.stringify(round)); } catch (_) {}
							return round;
						}
					} catch (e) {
						console.warn("Cloud round lookup failed; checking local recovery copies.", e);
					}
				}

				// Final local recovery for rounds created by older versions.
				for (const legacyKey of ["round-" + key, "round_" + key]) {
					try {
						const raw = localStorage.getItem(STORAGE_PREFIX + legacyKey);
						if (!raw) continue;
						const round = JSON.parse(raw);
						if (round && (String(round.id) === key || round.id == null) && round.players && round.courseId) {
							round.id = key; ROUNDS[key] = round; return round;
						}
					} catch (_) {}
				}
				try {
					for (let i = 0; i < localStorage.length; i++) {
						const storageKey = localStorage.key(i);
						if (!storageKey || !storageKey.startsWith(STORAGE_PREFIX + "round")) continue;
						try {
							const candidate = JSON.parse(localStorage.getItem(storageKey) || "null");
							if (candidate && String(candidate.id) === key && candidate.players && candidate.courseId) {
								ROUNDS[key] = candidate; return candidate;
							}
						} catch (_) {}
					}
				} catch (_) {}
				return null;
			}

			async function findRoundStorageKeys(id) {
				const key = String(id);
				const keys = new Set(["round:" + key, "round-" + key, "round_" + key]);

				// Find every local copy, including records saved by older versions.
				try {
					for (let i = 0; i < localStorage.length; i++) {
						const storageKey = localStorage.key(i);
						if (!storageKey || !storageKey.startsWith(STORAGE_PREFIX + "round")) continue;
						const appKey = storageKey.slice(STORAGE_PREFIX.length);
						if (appKey === "round:" + key || appKey === "round-" + key || appKey === "round_" + key) {
							keys.add(appKey);
							continue;
						}
						try {
							const candidate = JSON.parse(localStorage.getItem(storageKey) || "null");
							if (candidate && candidate.id != null && String(candidate.id) === key) keys.add(appKey);
						} catch (_) {}
					}
				} catch (_) {}

				// Find cloud records by both their key and embedded round id. This
				// catches rounds created before the current round-key convention.
				if (SB && AUTH_USER && navigator.onLine) {
					try {
						const rows = await cloudRows();
						for (const row of rows) {
							if (!row || !row.key) continue;
							if (String(row.key) === "round:" + key || String(row.key) === "round-" + key || String(row.key) === "round_" + key) {
								keys.add(String(row.key));
								continue;
							}
							try {
								if (row.value && row.value.id != null && String(row.value.id) === key) keys.add(String(row.key));
							} catch (_) {}
						}
					} catch (e) {
						console.warn("Could not scan cloud round records", e);
					}
				}
				return Array.from(keys);
			}

			async function deletePastRound(id) {
				const key = String(id);
				try {
					// The round may already be missing from cloud storage (for example
					// after an admin/database cleanup). Deletion should still remove its
					// history entry and any legacy/local copies instead of failing.
					const round = await loadRoundById(key);

					// First discover every old/new storage key for this round.
					const storageKeys = await findRoundStorageKeys(key);

					// Remove tracked-shot contributions from club data when the full round
					// object is available.
					const removedShots = round ? await removeRoundClubData(round) : 0;

					// Delete every discovered local/cloud copy, not just round:<id>.
					for (const storageKey of storageKeys) {
						try { localStorage.removeItem(STORAGE_PREFIX + storageKey); } catch (_) {}
						if (SB && AUTH_USER && navigator.onLine) await cloudDeleteKey(storageKey);
					}

					// Remove the history index entry and persist it synchronously to the cloud.
					ROUNDS_INDEX = ROUNDS_INDEX.filter(r => String(r.id) !== key);
					delete ROUNDS[key];
					try { localStorage.setItem(STORAGE_PREFIX + "rounds-index", JSON.stringify(ROUNDS_INDEX)); } catch (_) {}
					if (SB && AUTH_USER && navigator.onLine) await cloudWriteNow("rounds-index", ROUNDS_INDEX);

					// Verify none of the matching cloud records survived.
					if (SB && AUTH_USER && navigator.onLine) {
						const remaining = await cloudRows();
						const leftovers = remaining.filter(r => storageKeys.includes(String(r.key)) || (r.value && String(r.value.id) === key));
						if (leftovers.length) throw new Error("The server did not confirm deletion of the old round record.");
					}

					closeModal();
					toast(
						removedShots
							? "Round deleted and " + removedShots + " tracked club shot" + (removedShots === 1 ? "" : "s") + " removed from your bag data"
							: "Round deleted",
						"ok"
					);
					renderHistory();
					renderHome();
					if (currentView === "bag") renderBag();
				} catch (e) {
					console.error("Round deletion failed", e);
					toast(e.message || "Could not delete this round. Please try again while signed in.", "err");
				}
			}

			async function viewRoundDetail(id) {
				const round = await loadRoundById(id);
